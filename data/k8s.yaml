# Configuration for the policy/kubernetes package.
#
# The list is the policy. Adding an entry here is the review gate; the Rego
# never changes.
#
# Loaded as `data.k8s`, following the one-document-per-package convention in
# data/gha.yaml. The key is `k8s` rather than `kubernetes` so that base data and
# the `kubernetes` policy package stay in separate namespaces.
k8s:
  # K8S-006: registries images may be pulled from.
  #
  # Docker Hub is deliberately absent. An image reference with no registry
  # component resolves to docker.io at pull time, so leaving it off is what
  # makes a bare `nginx:1.27` fail rather than quietly pulling from the public
  # internet.
  approved_registries:
    - registry.example.com
    - ghcr.io

  # K8S-013: capabilities a container may add back on top of `drop: [ALL]`.
  #
  # NET_BIND_SERVICE is the only addition Pod Security Standards `restricted`
  # permits, and everything absent here is denied — `SYS_ADMIN` most of all,
  # which is close enough to root that adding it undoes K8S-009 entirely.
  allowed_capabilities:
    - NET_BIND_SERVICE
