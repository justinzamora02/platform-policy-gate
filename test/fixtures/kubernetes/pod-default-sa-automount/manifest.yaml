# K8S-010 fail fixture. No `serviceAccountName`, so this pod runs as the
# namespace default SA — the omission is the binding, and it is the form nearly
# every real manifest takes.
apiVersion: v1
kind: Pod
metadata:
  name: default-sa-automount-pod
spec:
  automountServiceAccountToken: true
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: registry.example.com/app:1.0.0
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
