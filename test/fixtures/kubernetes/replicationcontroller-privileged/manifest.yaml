apiVersion: v1
kind: ReplicationController
metadata:
  name: privileged-replicationcontroller
spec:
  selector:
    app: privileged
  template:
    metadata:
      labels:
        app: privileged
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: registry.example.com/app:1.0.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
