# K8S-002 fail fixture: runAsNonRoot set at neither the pod nor the container
# level. Both containers should be reported, not just the first.
apiVersion: v1
kind: Pod
metadata:
  name: run-as-root-pod
spec:
  initContainers:
    - name: init
      image: registry.example.com/init:1.0.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
  containers:
    - name: app
      image: registry.example.com/app:1.0.0
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
