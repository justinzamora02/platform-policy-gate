# K8S-006 fail fixture covering both ways an image leaves the allowlist.
#
# `app` names an unapproved registry outright. `init` names none at all, which
# resolves to docker.io at pull time — the finding has to say docker.io rather
# than treating the absent component as nothing to check.
apiVersion: v1
kind: Pod
metadata:
  name: unapproved-registry-pod
spec:
  securityContext:
    runAsNonRoot: true
  initContainers:
    - name: init
      image: busybox:1.36
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
  containers:
    - name: app
      image: quay.io/vendor/app:2.1.0
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
