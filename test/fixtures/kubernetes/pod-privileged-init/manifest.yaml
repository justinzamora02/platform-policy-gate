# K8S-001 fail fixture where only the init container is privileged.
#
# The regular container is clean, so a traversal that walks `spec.containers`
# alone reports nothing here. That is the bug this fixture exists to catch.
apiVersion: v1
kind: Pod
metadata:
  name: privileged-init-pod
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
  initContainers:
    - name: init
      image: registry.example.com/init:1.0.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        privileged: true
  containers:
    - name: app
      image: registry.example.com/app:1.0.0
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
