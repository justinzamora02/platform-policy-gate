# Traversal fixture: PodSpec one template down.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: compliant-statefulset
spec:
  serviceName: compliant
  replicas: 1
  selector:
    matchLabels:
      app: compliant
  template:
    metadata:
      labels:
        app: compliant
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: init
          image: registry.example.com/init:1.0.0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: app
          image: registry.example.com/app:1.0.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
