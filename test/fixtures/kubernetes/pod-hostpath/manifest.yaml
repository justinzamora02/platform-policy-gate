# K8S-004 fail fixture. The emptyDir volume alongside it must not be reported.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
  volumes:
    - name: cache
      emptyDir: {}
    - name: docker-socket
      hostPath:
        path: /var/run/docker.sock
  containers:
    - name: app
      image: registry.example.com/app:1.0.0
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
