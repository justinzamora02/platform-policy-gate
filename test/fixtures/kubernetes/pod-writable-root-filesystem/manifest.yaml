# K8S-008 fail fixture, with the two shapes the rule has to treat alike.
#
# `app` opts out explicitly; `init` never mentions the field. Both leave a
# writable root filesystem, so both must be reported — a rule testing only for
# `readOnlyRootFilesystem: false` would pass `init`.
apiVersion: v1
kind: Pod
metadata:
  name: writable-root-filesystem-pod
spec:
  securityContext:
    runAsNonRoot: true
  initContainers:
    - name: init
      image: registry.example.com/init:1.0.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        capabilities:
          drop: [ALL]
  containers:
    - name: app
      image: registry.example.com/app:1.0.0
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        readOnlyRootFilesystem: false
        capabilities:
          drop: [ALL]
