# K8S-009 fail fixture, with the two shapes the rule has to treat alike.
#
# `app` drops a capability but not the set, which is the case a presence check
# on `capabilities.drop` alone would pass. `init` has no capabilities block, so
# it keeps the full default set including CAP_SETUID and CAP_NET_RAW.
apiVersion: v1
kind: Pod
metadata:
  name: missing-capability-drop-pod
spec:
  securityContext:
    runAsNonRoot: true
  initContainers:
    - name: init
      image: registry.example.com/init:1.0.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        readOnlyRootFilesystem: true
  containers:
    - name: app
      image: registry.example.com/app:1.0.0
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop: [NET_RAW]
