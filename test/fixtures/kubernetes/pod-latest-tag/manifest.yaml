# K8S-007 fail fixture: an explicit `:latest`.
apiVersion: v1
kind: Pod
metadata:
  name: latest-tag-pod
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: registry.example.com/app:latest
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
