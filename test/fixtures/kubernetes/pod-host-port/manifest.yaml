# K8S-014 fail fixture.
#
# `app` binds 8080 on the node, reachable regardless of any NetworkPolicy.
# `init` declares a containerPort and no hostPort, which is the ordinary way to
# document a port and must stay clean.
apiVersion: v1
kind: Pod
metadata:
  name: host-port-pod
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
  initContainers:
    - name: init
      image: registry.example.com/init:1.0.0
      ports:
        - name: metrics
          containerPort: 9090
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
  containers:
    - name: app
      image: registry.example.com/app:1.0.0
      ports:
        - name: http
          containerPort: 8080
          hostPort: 8080
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
