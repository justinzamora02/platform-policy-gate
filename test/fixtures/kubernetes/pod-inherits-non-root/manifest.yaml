# K8S-002 pass fixture: the pod sets runAsNonRoot and the container says
# nothing about it, so it inherits. A rule that only reads the container's own
# securityContext fails this valid manifest. The container-only fields it does
# set are there to keep it silent on K8S-008 and K8S-009.
apiVersion: v1
kind: Pod
metadata:
  name: inherits-non-root-pod
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: registry.example.com/app:1.0.0
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
