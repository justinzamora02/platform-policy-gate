name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.18.2

      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.68.2
        run: |
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      # `make check` runs this too, so in the passing case it runs twice — a
      # second under a second. It is a step of its own, and it is first,
      # because the two failures mean different things: `make check` going red
      # means the policies are broken, this going red means the policies are
      # fine and *this repository* violates them. Buried inside `make check`
      # that distinction reaches a reviewer as one red X and a wall of
      # Conftest output; named here, the job summary says which it was, and a
      # violation stops the job before the slower checks run.
      - name: Enforce our own policies on this repo (GHA-001-003, REPO-001-002)
        run: make self-check

      # Same entry point a reviewer runs locally: formatting, strict type
      # check, `opa test`, `conftest verify`, the rule-coverage gate — which
      # fails the job rather than let a rule reach master with no test that
      # trips it — and the self-enforcement check above.
      - name: Format, type-check, test, rule coverage
        run: make check
