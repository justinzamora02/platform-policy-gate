# Reusable policy check, called by consuming repositories. `workflow_call` runs
# in the caller's context, so this checks out two repositories and evaluates one
# against the other.
#
# Every leg normalizes its output and uploads it as an artifact without gating;
# the final `aggregate` job merges them and is the only job that fails the run.
# See README § Using it from another repository.
name: policy-check

on:
  workflow_call:
    inputs:
      manifest-paths:
        description: >-
          Whitespace-separated files or directories in the calling repository
          holding rendered Kubernetes manifests. Directories are walked
          recursively. Globs are not expanded — pass the directory instead, so
          that a pattern matching nothing cannot be mistaken for a clean run.
        type: string
        required: false
        default: manifests

      policy-ref:
        description: >-
          Ref of platform-policy-gate to evaluate against — a tag or a full
          commit SHA. Required with no default on purpose: policy is versioned
          input to the caller's build, and a floating default would let a rule
          added here turn a caller's green check red without a commit on either
          side.
        type: string
        required: true

      policy-repository:
        description: >-
          Repository holding the policies, as `owner/repo`. Overridable so a
          fork can test policy changes against its own callers before they are
          merged upstream.
        type: string
        required: false
        default: justinzamora02/platform-policy-gate

      fail-on-warn:
        description: >-
          Fail the job on `warn` findings as well as `deny`. Default false, so
          that a rule introduced at `warn` gives callers a grace period before
          it is promoted to `deny`.
        type: boolean
        required: false
        default: false

      exceptions-file:
        description: >-
          Path in the calling repository to a policy-exceptions file. Its
          shape and expiry are validated by policy/exceptions — a missing or
          malformed field, a wildcard rule ID, or an expired entry all fail
          closed as `deny` findings rather than being silently ignored. A file
          that does not exist suppresses nothing; it is not an error.
        type: string
        required: false
        default: .platform-policy-exceptions.yaml

# These jobs read two repositories and write nothing. Declared here rather than
# inherited, so a caller's broad default token is not handed to policy
# evaluation.
permissions:
  contents: read

jobs:
  discover-helm:
    name: Discover Helm charts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.charts.outputs.matrix }}
      has_charts: ${{ steps.charts.outputs.has_charts }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false

      # JSON construction belongs to jq: shell concatenation would make a
      # quote or space in a caller-controlled path corrupt fromJSON below.
      - name: Build the Helm render matrix
        id: charts
        run: |
          set -euo pipefail

          matrix="$(jq -cn '{include: []}')"

          while IFS= read -r -d '' chart_file; do
            chart="${chart_file%/Chart.yaml}"
            found_values=false

            while IFS= read -r -d '' values_file; do
              found_values=true
              matrix="$(
                jq -c \
                  --arg chart "$chart" \
                  --arg values "$values_file" \
                  --arg coverage "$values_file" \
                  '.include += [{chart: $chart, values: $values, coverage: $coverage}]' \
                  <<<"$matrix"
              )"
            done < <(find "$chart" -maxdepth 1 -type f -name 'values*.yaml' -print0)

            if [ "$found_values" = "false" ]; then
              matrix="$(
                jq -c \
                  --arg chart "$chart" \
                  --arg coverage 'chart defaults (no values*.yaml found)' \
                  '.include += [{chart: $chart, values: "", coverage: $coverage}]' \
                  <<<"$matrix"
              )"
            fi
          done < <(find . -type f -name Chart.yaml -print0)

          count="$(jq '.include | length' <<<"$matrix")"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

          if [ "$count" -eq 0 ]; then
            printf 'has_charts=false\n' >>"$GITHUB_OUTPUT"
          else
            printf 'has_charts=true\n' >>"$GITHUB_OUTPUT"
          fi

  helm:
    # Coverage in the check name, not only the logs: a green check must show
    # which committed values file it proves compliant.
    name: Helm — ${{ matrix.chart }} — ${{ matrix.coverage }}
    needs: discover-helm
    if: needs.discover-helm.outputs.has_charts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-helm.outputs.matrix) }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the policies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      # Pinned: the runner's Helm version changes independently of this policy
      # ref, and identical chart inputs must render identically.
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
          token: ''

      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.68.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      # Matrix values reach the shell through env so a caller-controlled path
      # cannot close a quote and execute on the runner.
      - name: Helm lint
        env:
          CHART_PATH: ${{ matrix.chart }}
          VALUES_FILE: ${{ matrix.values }}
        run: |
          set -euo pipefail

          helm_args=("$CHART_PATH")
          if [ -n "$VALUES_FILE" ]; then
            # Helm parses --values as CSV even when it receives one shell
            # argument, so quote-bearing filenames need CSV escaping too.
            values_csv="${VALUES_FILE//\"/\"\"}"
            helm_args+=(--values "\"$values_csv\"")
          fi

          helm lint "${helm_args[@]}"

      # pipefail is load-bearing: without it a failed render is hidden by
      # Conftest successfully evaluating an empty stream. `|| true` because this
      # leg reports findings and only `aggregate` gates.
      - name: Conftest — rendered Helm chart
        env:
          CHART_PATH: ${{ matrix.chart }}
          VALUES_FILE: ${{ matrix.values }}
          VALUES_COVERAGE: ${{ matrix.coverage }}
        run: |
          set -euo pipefail

          printf 'Values coverage: %s\n' "$VALUES_COVERAGE"

          helm_args=("$CHART_PATH")
          if [ -n "$VALUES_FILE" ]; then
            values_csv="${VALUES_FILE//\"/\"\"}"
            helm_args+=(--values "\"$values_csv\"")
          fi

          helm template policy-check "${helm_args[@]}" \
            | conftest test \
              --policy .policy-gate/policy \
              --data .policy-gate/data \
              --namespace kubernetes \
              --output json \
              - >raw.json || true

          jq empty raw.json
          .policy-gate/scripts/normalize-conftest.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings-helm-${{ strategy.job-index }}
          path: findings.json
          retention-days: 1

  no-helm-charts:
    # An explicit check, so broken discovery does not look like a chart that
    # passed.
    name: Helm — no charts found
    needs: discover-helm
    if: needs.discover-helm.outputs.has_charts == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Report no charts found
        run: |
          set -euo pipefail
          echo '::notice title=Helm chart discovery::no charts found'

  kubernetes:
    # Not an input: a `runs-on: ${{ inputs.runner }}` would defeat GHA-003,
    # which reads runner labels statically out of the YAML.
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: false` keeps the caller's token out of
      # `.git/config`, where any later step could read it.
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false

      # Dotted path, so the policies cannot themselves be picked up as manifests
      # when a caller points `manifest-paths` at `.`.
      - name: Check out the policies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      # Pinned to the version `make check` and test.yml run, so a caller is
      # never failed or passed by an untested Conftest release.
      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.68.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      # Caller-controlled inputs reach the shell through `env`, never through
      # `${{ }}` inside the script body: inlined expansion would let
      # `manifest-paths` close the quote and run commands on a runner holding
      # the caller's token.
      - name: Conftest — Kubernetes manifests
        env:
          MANIFEST_PATHS: ${{ inputs.manifest-paths }}
        run: |
          set -euo pipefail

          # Word-split once, deliberately, then quote every element. Paths with
          # spaces are unsupported for that reason and the docs say so.
          read -ra paths <<<"$MANIFEST_PATHS"

          # Both flags are load-bearing: Conftest defaults to the empty `main`
          # namespace, and K8S-006 comprehends over its allowlist, so a missing
          # data root approves nothing rather than everything.
          conftest test \
            --policy .policy-gate/policy \
            --data .policy-gate/data \
            --namespace kubernetes \
            --output json \
            "${paths[@]}" >raw.json || true

          # A bad `manifest-paths` makes Conftest emit no JSON rather than `[]`,
          # which is the only way to tell "no findings" from "nothing was
          # evaluated". Checked explicitly so `|| true` cannot swallow it.
          jq empty raw.json
          .policy-gate/scripts/normalize-conftest.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings-kubernetes
          path: findings.json
          retention-days: 1

  zizmor:
    # Zizmor covers injection, permissions, and artifact poisoning — the
    # analysis GHA-001 deliberately does not attempt.
    name: Zizmor — .github/workflows/
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the policies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      - name: Install Zizmor
        env:
          ZIZMOR_VERSION: 1.28.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin zizmor

      # `--offline` because this job carries no GitHub token, and a caller's
      # check should not depend on network reachability at audit time.
      - name: Zizmor
        run: |
          set -euo pipefail
          zizmor --offline --format json .github/workflows/ >raw.json || true
          jq empty raw.json
          .policy-gate/scripts/normalize-zizmor.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings-zizmor
          path: findings.json
          retention-days: 1

  discover-dockerfiles:
    name: Discover Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      has_dockerfiles: ${{ steps.find.outputs.has_dockerfiles }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false

      - name: Look for Dockerfiles
        id: find
        run: |
          set -euo pipefail
          if [ -n "$(find . -type f -name 'Dockerfile*' -print -quit)" ]; then
            printf 'has_dockerfiles=true\n' >>"$GITHUB_OUTPUT"
          else
            printf 'has_dockerfiles=false\n' >>"$GITHUB_OUTPUT"
          fi

  hadolint:
    # Hadolint owns every Dockerfile instruction except FROM, which
    # DOCKER-001/002 cover.
    name: Hadolint — Dockerfiles
    needs: discover-dockerfiles
    if: needs.discover-dockerfiles.outputs.has_dockerfiles == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the policies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      - name: Install Hadolint
        env:
          HADOLINT_VERSION: 2.12.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Hadolint
        run: |
          set -euo pipefail
          mapfile -d '' -t dockerfiles < <(find . -type f -name 'Dockerfile*' -print0)
          hadolint --format json "${dockerfiles[@]}" >raw.json || true
          jq empty raw.json
          .policy-gate/scripts/normalize-hadolint.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings-hadolint
          path: findings.json
          retention-days: 1

  dockerfile:
    # DOCKER-001/002/003 own the FROM instruction; Hadolint owns the rest.
    name: Conftest — Dockerfiles
    needs: discover-dockerfiles
    if: needs.discover-dockerfiles.outputs.has_dockerfiles == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the policies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.68.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      - name: Conftest — Dockerfiles
        run: |
          set -euo pipefail
          mapfile -d '' -t dockerfiles < <(find . -type f -name 'Dockerfile*' -print0)
          conftest test \
            --policy .policy-gate/policy \
            --data .policy-gate/data \
            --namespace dockerfile \
            --output json \
            "${dockerfiles[@]}" >raw.json || true
          jq empty raw.json
          .policy-gate/scripts/normalize-conftest.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-dockerfile
          path: findings.json
          retention-days: 1

  github-workflows:
    # GHA-001/002/003/004 own SHA pinning, action/runner allowlists, and
    # explicit `permissions:`. Zizmor owns the deeper analysis.
    name: Conftest — GitHub workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the policies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.68.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      - name: Conftest — GitHub workflows
        run: |
          set -euo pipefail
          conftest test \
            --policy .policy-gate/policy \
            --data .policy-gate/data \
            --namespace github \
            --output json \
            .github/workflows/ >raw.json || true
          jq empty raw.json
          .policy-gate/scripts/normalize-conftest.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-github-workflows
          path: findings.json
          retention-days: 1

  repo-hygiene:
    # REPO-001/002 read a `{"files": [...]}` inventory of the calling
    # repository's working tree, not a manifest.
    name: Conftest — repo hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the policies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.68.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      - name: Conftest — repo hygiene
        run: |
          set -euo pipefail
          .policy-gate/scripts/repo-inventory.sh . >repo-inventory.json
          conftest test \
            --policy .policy-gate/policy \
            --data .policy-gate/data \
            --namespace repo \
            --output json \
            repo-inventory.json >raw.json || true
          jq empty raw.json
          .policy-gate/scripts/normalize-conftest.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-repo-hygiene
          path: findings.json
          retention-days: 1

  exceptions:
    # A missing exceptions file is not an error; a present-but-invalid one is.
    # Validated here so it surfaces as a `deny` in the same summary as
    # everything else, rather than failing silently at suppression time.
    name: Validate policy exceptions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the policies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.68.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      - name: Conftest — policy exceptions
        env:
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
        run: |
          set -euo pipefail
          if [ -f "$EXCEPTIONS_FILE" ]; then
            conftest test \
              --policy .policy-gate/policy \
              --data .policy-gate/data \
              --namespace exceptions \
              --output json \
              "$EXCEPTIONS_FILE" >raw.json || true
          else
            echo '[]' >raw.json
          fi
          jq empty raw.json
          .policy-gate/scripts/normalize-conftest.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings-exceptions
          path: findings.json
          retention-days: 1

  aggregate:
    name: Aggregate findings
    # `if: always()` because `no-helm-charts` and `hadolint` legitimately skip,
    # so this has to run whether the others succeed, fail, or are skipped.
    needs:
      [
        kubernetes,
        helm,
        no-helm-charts,
        zizmor,
        discover-dockerfiles,
        hadolint,
        dockerfile,
        github-workflows,
        repo-hygiene,
        exceptions,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Needed to apply the calling repository's exceptions file, at the same
      # path the `exceptions` job validated.
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false

      # For scripts/aggregate-findings.sh and scripts/apply-exceptions.sh.
      - name: Check out the policies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.18.2

      - name: Fail if a policy leg did not complete
        env:
          JOB_STATUSES: >-
            ${{ needs.kubernetes.result }}
            ${{ needs.helm.result }}
            ${{ needs.no-helm-charts.result }}
            ${{ needs.zizmor.result }}
            ${{ needs.discover-dockerfiles.result }}
            ${{ needs.hadolint.result }}
            ${{ needs.dockerfile.result }}
            ${{ needs.github-workflows.result }}
            ${{ needs.repo-hygiene.result }}
            ${{ needs.exceptions.result }}
        run: |
          set -euo pipefail
          for status in $JOB_STATUSES; do
            case "$status" in
              success|skipped) ;;
              *)
                echo "::error::A policy leg ended with status: $status"
                exit 1
                ;;
            esac
          done

      - name: Download findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: findings-*
          path: findings
          merge-multiple: false

      # Never applied to the `exceptions` leg's own EXC-* findings, or an
      # exceptions file could suppress the validation that failed it closed.
      - name: Apply exceptions
        env:
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
        run: |
          set -euo pipefail
          for dir in findings/*/; do
            name="$(basename "$dir")"
            if [ "$name" = "findings-exceptions" ]; then
              continue
            fi
            .policy-gate/scripts/apply-exceptions.sh "$EXCEPTIONS_FILE" "$dir/findings.json" \
              >"$dir/findings.json.suppressed"
            mv "$dir/findings.json.suppressed" "$dir/findings.json"
          done

      - name: Render summary and gate on deny findings
        env:
          FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(findings/*/findings.json)
          .policy-gate/scripts/aggregate-findings.sh "${files[@]}"
