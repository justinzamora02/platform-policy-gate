# Reusable policy check, called by consuming repositories.
#
# `workflow_call` runs in the caller's context: the caller's repository is what
# `actions/checkout` resolves to by default, and secrets/permissions are the
# caller's. The policies, however, live here — so this workflow checks out two
# repositories and evaluates one against the other.
#
# Scope today is plain Kubernetes manifests and locally rendered Helm charts.
# The aggregated summary is a separate concern and lands later; a caller wiring
# this up now gets real pass/fail gates, not placeholders.
name: policy-check

on:
  workflow_call:
    inputs:
      manifest-paths:
        description: >-
          Whitespace-separated files or directories in the calling repository
          holding rendered Kubernetes manifests. Directories are walked
          recursively. Globs are not expanded — pass the directory instead, so
          that a pattern matching nothing cannot be mistaken for a clean run.
        type: string
        required: false
        default: manifests

      policy-ref:
        description: >-
          Ref of platform-policy-gate to evaluate against — a tag or a full
          commit SHA. Required with no default on purpose: policy is versioned
          input to the caller's build, and a floating default would let a rule
          added here turn a caller's green check red without a commit on either
          side.
        type: string
        required: true

      policy-repository:
        description: >-
          Repository holding the policies, as `owner/repo`. Overridable so a
          fork can test policy changes against its own callers before they are
          merged upstream.
        type: string
        required: false
        default: justinzamora02/platform-policy-gate

      fail-on-warn:
        description: >-
          Fail the job on `warn` findings as well as `deny`. Default false, so
          that a rule introduced at `warn` gives callers a grace period before
          it is promoted to `deny`.
        type: boolean
        required: false
        default: false

# The jobs read two repositories and write nothing. Declaring permissions here
# rather than inheriting the caller's token scope means a caller with a broad
# default token does not hand that scope to policy evaluation.
permissions:
  contents: read

jobs:
  discover-helm:
    name: Discover Helm charts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.charts.outputs.matrix }}
      has_charts: ${{ steps.charts.outputs.has_charts }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      # JSON construction belongs to jq: shell concatenation would make a
      # quote or space in a caller-controlled path corrupt fromJSON below.
      - name: Build the Helm render matrix
        id: charts
        run: |
          set -euo pipefail

          matrix="$(jq -cn '{include: []}')"

          while IFS= read -r -d '' chart_file; do
            chart="${chart_file%/Chart.yaml}"
            found_values=false

            while IFS= read -r -d '' values_file; do
              found_values=true
              matrix="$(
                jq -c \
                  --arg chart "$chart" \
                  --arg values "$values_file" \
                  --arg coverage "$values_file" \
                  '.include += [{chart: $chart, values: $values, coverage: $coverage}]' \
                  <<<"$matrix"
              )"
            done < <(find "$chart" -maxdepth 1 -type f -name 'values*.yaml' -print0)

            if [ "$found_values" = "false" ]; then
              matrix="$(
                jq -c \
                  --arg chart "$chart" \
                  --arg coverage 'chart defaults (no values*.yaml found)' \
                  '.include += [{chart: $chart, values: "", coverage: $coverage}]' \
                  <<<"$matrix"
              )"
            fi
          done < <(find . -type f -name Chart.yaml -print0)

          count="$(jq '.include | length' <<<"$matrix")"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

          if [ "$count" -eq 0 ]; then
            printf 'has_charts=false\n' >>"$GITHUB_OUTPUT"
          else
            printf 'has_charts=true\n' >>"$GITHUB_OUTPUT"
          fi

  helm:
    # Coverage belongs in the check name, not only its logs: a green check must
    # show exactly which committed values file it proves compliant.
    name: Helm — ${{ matrix.chart }} — ${{ matrix.coverage }}
    needs: discover-helm
    if: needs.discover-helm.outputs.has_charts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-helm.outputs.matrix) }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the policies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      # The hosted runner's Helm version changes independently of this policy
      # ref; pinning it keeps identical chart inputs rendering identically.
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.4
          token: ''

      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.68.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      # Matrix values reach the shell through env so a caller-controlled path
      # cannot close a quote and execute on the runner.
      - name: Helm lint
        env:
          CHART_PATH: ${{ matrix.chart }}
          VALUES_FILE: ${{ matrix.values }}
        run: |
          set -euo pipefail

          helm_args=("$CHART_PATH")
          if [ -n "$VALUES_FILE" ]; then
            # Helm parses --values as CSV even when it receives one shell
            # argument, so quote-bearing filenames need CSV escaping too.
            values_csv="${VALUES_FILE//\"/\"\"}"
            helm_args+=(--values "\"$values_csv\"")
          fi

          helm lint "${helm_args[@]}"

      # pipefail is load-bearing: without it a failed render could be hidden by
      # Conftest successfully evaluating an empty stream.
      - name: Conftest — rendered Helm chart
        env:
          CHART_PATH: ${{ matrix.chart }}
          VALUES_FILE: ${{ matrix.values }}
          VALUES_COVERAGE: ${{ matrix.coverage }}
          FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
        run: |
          set -euo pipefail

          printf 'Values coverage: %s\n' "$VALUES_COVERAGE"

          helm_args=("$CHART_PATH")
          if [ -n "$VALUES_FILE" ]; then
            values_csv="${VALUES_FILE//\"/\"\"}"
            helm_args+=(--values "\"$values_csv\"")
          fi

          conftest_args=(
            --policy .policy-gate/policy
            --data .policy-gate/data
            --namespace kubernetes
          )

          if [ "$FAIL_ON_WARN" = "true" ]; then
            conftest_args+=(--fail-on-warn)
          fi

          helm template policy-check "${helm_args[@]}" \
            | conftest test "${conftest_args[@]}" -

  no-helm-charts:
    # An explicit check prevents a repository with broken discovery or no
    # charts from looking indistinguishable from one whose charts passed.
    name: Helm — no charts found
    needs: discover-helm
    if: needs.discover-helm.outputs.has_charts == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Report no charts found
        run: |
          set -euo pipefail
          echo '::notice title=Helm chart discovery::no charts found'

  kubernetes:
    # Not an input. A `runs-on: ${{ inputs.runner }}` would defeat GHA-003,
    # which approves runner labels by reading them statically out of the YAML —
    # an expression is not a label it can check.
    runs-on: ubuntu-latest
    steps:
      # Default repository/ref in a `workflow_call` is the caller's, at the
      # commit that triggered it. `persist-credentials: false` keeps the token
      # out of `.git/config`, where any later step — including one added to the
      # caller's manifests directory — could read it.
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      # Second checkout under a dotted path so the policies cannot themselves
      # be picked up as manifests when a caller points `manifest-paths` at `.`.
      - name: Check out the policies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      # Pinned to the version `make check` and test.yml run, so a caller cannot
      # be failed — or passed — by a Conftest release the policies were never
      # tested against.
      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.68.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      # Inputs reach the shell through `env`, never through `${{ }}` inside the
      # script body: a caller controls every one of these values, and inlined
      # expansion would let `manifest-paths` close the quote and run commands on
      # a runner holding the caller's token.
      #
      # Conftest exits non-zero on any `deny`, which is the gate — no explicit
      # exit handling, because swallowing that code is how these checks quietly
      # stop enforcing anything.
      - name: Conftest — Kubernetes manifests
        env:
          MANIFEST_PATHS: ${{ inputs.manifest-paths }}
          FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
        run: |
          set -euo pipefail

          # Word-split once, deliberately, then quote every element. Paths with
          # spaces are unsupported for that reason and the docs say so.
          read -ra paths <<<"$MANIFEST_PATHS"

          # `--namespace kubernetes` because Conftest defaults to `main`, which
          # holds no rules here and would report zero findings on anything.
          #
          # `--data .policy-gate/data` is load-bearing: K8S-006 reads its
          # registry allowlist from there and comprehends over it, so a missing
          # data root approves nothing rather than everything. Dropping the flag
          # turns the check red, not green.
          #
          # Seeded rather than started empty so that `set -u` never sees an
          # unset array — bash 3.2 errors on `"${empty[@]}"`, which would make
          # this script fail differently when a reviewer runs it on macOS than
          # it does on the runner.
          args=(
            --policy .policy-gate/policy
            --data .policy-gate/data
            --namespace kubernetes
          )

          if [ "$FAIL_ON_WARN" = "true" ]; then
            args+=(--fail-on-warn)
          fi

          # A path that matches no files is an error from Conftest and is left
          # to fail the job — a misconfigured `manifest-paths` reporting success
          # is worse than one reporting failure.
          conftest test "${args[@]}" "${paths[@]}"
