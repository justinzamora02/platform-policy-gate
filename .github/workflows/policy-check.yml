# Reusable policy check, called by consuming repositories.
#
# `workflow_call` runs in the caller's context: the caller's repository is what
# `actions/checkout` resolves to by default, and secrets/permissions are the
# caller's. The policies, however, live here — so this workflow checks out two
# repositories and evaluates one against the other.
#
# Scope is Kubernetes manifests and locally rendered Helm charts (Conftest),
# GitHub Actions workflows (Conftest + Zizmor), and Dockerfiles (Conftest +
# Hadolint).
#
# Every leg writes its result as JSON, normalizes it with the matching
# scripts/normalize-*.sh into one finding shape, and uploads it as an artifact
# — none of them gate their own job on the underlying tool's exit code. A
# final `aggregate` job downloads every artifact, merges them with
# scripts/aggregate-findings.sh, posts one job summary, and is the only job
# that fails the run. That is what makes the check one legible red/green
# signal instead of four tools' worth of raw output a reviewer has to open
# individually.
name: policy-check

on:
  workflow_call:
    inputs:
      manifest-paths:
        description: >-
          Whitespace-separated files or directories in the calling repository
          holding rendered Kubernetes manifests. Directories are walked
          recursively. Globs are not expanded — pass the directory instead, so
          that a pattern matching nothing cannot be mistaken for a clean run.
        type: string
        required: false
        default: manifests

      policy-ref:
        description: >-
          Ref of platform-policy-gate to evaluate against — a tag or a full
          commit SHA. Required with no default on purpose: policy is versioned
          input to the caller's build, and a floating default would let a rule
          added here turn a caller's green check red without a commit on either
          side.
        type: string
        required: true

      policy-repository:
        description: >-
          Repository holding the policies, as `owner/repo`. Overridable so a
          fork can test policy changes against its own callers before they are
          merged upstream.
        type: string
        required: false
        default: justinzamora02/platform-policy-gate

      fail-on-warn:
        description: >-
          Fail the job on `warn` findings as well as `deny`. Default false, so
          that a rule introduced at `warn` gives callers a grace period before
          it is promoted to `deny`.
        type: boolean
        required: false
        default: false

      exceptions-file:
        description: >-
          Path in the calling repository to a policy-exceptions file. Its
          shape and expiry are validated by policy/exceptions — a missing or
          malformed field, a wildcard rule ID, or an expired entry all fail
          closed as `deny` findings rather than being silently ignored. A file
          that does not exist suppresses nothing; it is not an error.
        type: string
        required: false
        default: .platform-policy-exceptions.yaml

# The jobs read two repositories and write nothing. Declaring permissions here
# rather than inheriting the caller's token scope means a caller with a broad
# default token does not hand that scope to policy evaluation.
permissions:
  contents: read

jobs:
  discover-helm:
    name: Discover Helm charts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.charts.outputs.matrix }}
      has_charts: ${{ steps.charts.outputs.has_charts }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      # JSON construction belongs to jq: shell concatenation would make a
      # quote or space in a caller-controlled path corrupt fromJSON below.
      - name: Build the Helm render matrix
        id: charts
        run: |
          set -euo pipefail

          matrix="$(jq -cn '{include: []}')"

          while IFS= read -r -d '' chart_file; do
            chart="${chart_file%/Chart.yaml}"
            found_values=false

            while IFS= read -r -d '' values_file; do
              found_values=true
              matrix="$(
                jq -c \
                  --arg chart "$chart" \
                  --arg values "$values_file" \
                  --arg coverage "$values_file" \
                  '.include += [{chart: $chart, values: $values, coverage: $coverage}]' \
                  <<<"$matrix"
              )"
            done < <(find "$chart" -maxdepth 1 -type f -name 'values*.yaml' -print0)

            if [ "$found_values" = "false" ]; then
              matrix="$(
                jq -c \
                  --arg chart "$chart" \
                  --arg coverage 'chart defaults (no values*.yaml found)' \
                  '.include += [{chart: $chart, values: "", coverage: $coverage}]' \
                  <<<"$matrix"
              )"
            fi
          done < <(find . -type f -name Chart.yaml -print0)

          count="$(jq '.include | length' <<<"$matrix")"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

          if [ "$count" -eq 0 ]; then
            printf 'has_charts=false\n' >>"$GITHUB_OUTPUT"
          else
            printf 'has_charts=true\n' >>"$GITHUB_OUTPUT"
          fi

  helm:
    # Coverage belongs in the check name, not only its logs: a green check must
    # show exactly which committed values file it proves compliant.
    name: Helm — ${{ matrix.chart }} — ${{ matrix.coverage }}
    needs: discover-helm
    if: needs.discover-helm.outputs.has_charts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-helm.outputs.matrix) }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the policies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      # The hosted runner's Helm version changes independently of this policy
      # ref; pinning it keeps identical chart inputs rendering identically.
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.4
          token: ''

      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.68.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      # Matrix values reach the shell through env so a caller-controlled path
      # cannot close a quote and execute on the runner.
      - name: Helm lint
        env:
          CHART_PATH: ${{ matrix.chart }}
          VALUES_FILE: ${{ matrix.values }}
        run: |
          set -euo pipefail

          helm_args=("$CHART_PATH")
          if [ -n "$VALUES_FILE" ]; then
            # Helm parses --values as CSV even when it receives one shell
            # argument, so quote-bearing filenames need CSV escaping too.
            values_csv="${VALUES_FILE//\"/\"\"}"
            helm_args+=(--values "\"$values_csv\"")
          fi

          helm lint "${helm_args[@]}"

      # pipefail is load-bearing: without it a failed render could be hidden by
      # Conftest successfully evaluating an empty stream.
      #
      # No `--fail-on-warn` and no reliance on Conftest's own exit code: this
      # leg reports findings, it does not decide the run's outcome. The
      # `aggregate` job below is the only job that gates, so `|| true` lets the
      # artifact upload step still run when Conftest finds a `deny`.
      - name: Conftest — rendered Helm chart
        env:
          CHART_PATH: ${{ matrix.chart }}
          VALUES_FILE: ${{ matrix.values }}
          VALUES_COVERAGE: ${{ matrix.coverage }}
        run: |
          set -euo pipefail

          printf 'Values coverage: %s\n' "$VALUES_COVERAGE"

          helm_args=("$CHART_PATH")
          if [ -n "$VALUES_FILE" ]; then
            values_csv="${VALUES_FILE//\"/\"\"}"
            helm_args+=(--values "\"$values_csv\"")
          fi

          helm template policy-check "${helm_args[@]}" \
            | conftest test \
              --policy .policy-gate/policy \
              --data .policy-gate/data \
              --namespace kubernetes \
              --output json \
              - >raw.json || true

          jq empty raw.json
          .policy-gate/scripts/normalize-conftest.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-helm-${{ strategy.job-index }}
          path: findings.json
          retention-days: 1

  no-helm-charts:
    # An explicit check prevents a repository with broken discovery or no
    # charts from looking indistinguishable from one whose charts passed.
    name: Helm — no charts found
    needs: discover-helm
    if: needs.discover-helm.outputs.has_charts == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Report no charts found
        run: |
          set -euo pipefail
          echo '::notice title=Helm chart discovery::no charts found'

  kubernetes:
    # Not an input. A `runs-on: ${{ inputs.runner }}` would defeat GHA-003,
    # which approves runner labels by reading them statically out of the YAML —
    # an expression is not a label it can check.
    runs-on: ubuntu-latest
    steps:
      # Default repository/ref in a `workflow_call` is the caller's, at the
      # commit that triggered it. `persist-credentials: false` keeps the token
      # out of `.git/config`, where any later step — including one added to the
      # caller's manifests directory — could read it.
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      # Second checkout under a dotted path so the policies cannot themselves
      # be picked up as manifests when a caller points `manifest-paths` at `.`.
      - name: Check out the policies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      # Pinned to the version `make check` and test.yml run, so a caller cannot
      # be failed — or passed — by a Conftest release the policies were never
      # tested against.
      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.68.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      # Inputs reach the shell through `env`, never through `${{ }}` inside the
      # script body: a caller controls every one of these values, and inlined
      # expansion would let `manifest-paths` close the quote and run commands on
      # a runner holding the caller's token.
      #
      # This leg reports findings; it does not gate. The `aggregate` job below
      # is the only job that fails the run, so `|| true` lets the artifact
      # upload step run even when Conftest finds a `deny`. A path that matches
      # no files is still a hard failure here — that is a misconfiguration, not
      # a finding, and belongs to this job, not the aggregator.
      - name: Conftest — Kubernetes manifests
        env:
          MANIFEST_PATHS: ${{ inputs.manifest-paths }}
        run: |
          set -euo pipefail

          # Word-split once, deliberately, then quote every element. Paths with
          # spaces are unsupported for that reason and the docs say so.
          read -ra paths <<<"$MANIFEST_PATHS"

          # `--namespace kubernetes` because Conftest defaults to `main`, which
          # holds no rules here and would report zero findings on anything.
          #
          # `--data .policy-gate/data` is load-bearing: K8S-006 reads its
          # registry allowlist from there and comprehends over it, so a missing
          # data root approves nothing rather than everything. Dropping the flag
          # turns the check red, not green.
          conftest test \
            --policy .policy-gate/policy \
            --data .policy-gate/data \
            --namespace kubernetes \
            --output json \
            "${paths[@]}" >raw.json || true

          # A misconfigured or empty `manifest-paths` makes Conftest print an
          # error and emit no JSON at all, rather than `[]`. That is the only
          # way this step can tell "no findings" apart from "nothing was
          # evaluated" — checked explicitly, so it stays a hard failure instead
          # of being swallowed by the `|| true` above.
          jq empty raw.json
          .policy-gate/scripts/normalize-conftest.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-kubernetes
          path: findings.json
          retention-days: 1

  zizmor:
    # Zizmor covers injection, permissions, and artifact poisoning across
    # `.github/workflows/` — the analysis GHA-001 does not attempt (see
    # policy/github/workflow.rego). Judgment about that boundary is the point;
    # reimplementing Zizmor's audits in Rego would not be.
    name: Zizmor — .github/workflows/
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the policies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      - name: Install Zizmor
        env:
          ZIZMOR_VERSION: 1.28.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin zizmor

      # `--offline` because this job carries no GitHub token (permissions are
      # `contents: read` for the whole workflow) and a caller's check should
      # not depend on network reachability at audit time.
      #
      # A workflow directory always exists in any repository with CI, so no
      # "nothing found" branch is needed the way Helm discovery has one.
      - name: Zizmor
        run: |
          set -euo pipefail
          zizmor --offline --format json .github/workflows/ >raw.json || true
          jq empty raw.json
          .policy-gate/scripts/normalize-zizmor.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-zizmor
          path: findings.json
          retention-days: 1

  discover-dockerfiles:
    name: Discover Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      has_dockerfiles: ${{ steps.find.outputs.has_dockerfiles }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Look for Dockerfiles
        id: find
        run: |
          set -euo pipefail
          if [ -n "$(find . -type f -name 'Dockerfile*' -print -quit)" ]; then
            printf 'has_dockerfiles=true\n' >>"$GITHUB_OUTPUT"
          else
            printf 'has_dockerfiles=false\n' >>"$GITHUB_OUTPUT"
          fi

  hadolint:
    # Hadolint owns every Dockerfile instruction except FROM — DOCKER-001/002
    # in policy/dockerfile/dockerfile.rego cover the base-image registry and
    # tag, deliberately scoped narrowly so the two tools don't issue different
    # verdicts on the same hygiene rule.
    name: Hadolint — Dockerfiles
    needs: discover-dockerfiles
    if: needs.discover-dockerfiles.outputs.has_dockerfiles == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the policies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      - name: Install Hadolint
        env:
          HADOLINT_VERSION: 2.12.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Hadolint
        run: |
          set -euo pipefail
          mapfile -d '' -t dockerfiles < <(find . -type f -name 'Dockerfile*' -print0)
          hadolint --format json "${dockerfiles[@]}" >raw.json || true
          jq empty raw.json
          .policy-gate/scripts/normalize-hadolint.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-hadolint
          path: findings.json
          retention-days: 1

  exceptions:
    # A missing exceptions file is not an error — most consumers have none.
    # A present-but-invalid one is: shape and expiry are validated here so
    # that a malformed or expired entry surfaces as a `deny` in the same
    # summary as everything else, instead of failing silently at suppression
    # time in the `aggregate` job below.
    name: Validate policy exceptions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the policies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      - name: Install conftest
        env:
          CONFTEST_VERSION: 0.68.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      - name: Conftest — policy exceptions
        env:
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
        run: |
          set -euo pipefail
          if [ -f "$EXCEPTIONS_FILE" ]; then
            conftest test \
              --policy .policy-gate/policy \
              --data .policy-gate/data \
              --namespace exceptions \
              --output json \
              "$EXCEPTIONS_FILE" >raw.json || true
          else
            echo '[]' >raw.json
          fi
          jq empty raw.json
          .policy-gate/scripts/normalize-conftest.sh raw.json >findings.json

      - name: Upload findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: findings-exceptions
          path: findings.json
          retention-days: 1

  aggregate:
    name: Aggregate findings
    # `if: always()` because a `deny` in any leg reports success for the job
    # itself now (each leg's tool failure is swallowed with `|| true`) — and
    # `no-helm-charts`/`hadolint` legitimately skip, so this still has to run
    # when the others succeed, fail, or are skipped.
    needs: [kubernetes, helm, no-helm-charts, zizmor, discover-dockerfiles, hadolint, exceptions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Needed to apply the calling repository's exceptions file, at the same
      # path the `exceptions` job validated.
      - name: Check out the calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      # For scripts/aggregate-findings.sh and scripts/apply-exceptions.sh.
      - name: Check out the policies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          repository: ${{ inputs.policy-repository }}
          ref: ${{ inputs.policy-ref }}
          path: .policy-gate
          persist-credentials: false

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.18.2

      # `if-no-files-found: ignore` on download would silently produce zero
      # files for a job that never ran (e.g. `helm` when there are no charts);
      # the default `warn` is fine since `no-helm-charts` covers that case
      # explicitly and this step doesn't fail either way.
      - name: Download findings
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: findings-*
          path: findings
          merge-multiple: false

      # Suppression only ever applies to findings from the policy engines —
      # never to the `exceptions` leg's own EXC-* findings. Otherwise an
      # exceptions file could suppress the very validation that would have
      # failed it closed.
      - name: Apply exceptions
        env:
          EXCEPTIONS_FILE: ${{ inputs.exceptions-file }}
        run: |
          set -euo pipefail
          for dir in findings/*/; do
            name="$(basename "$dir")"
            if [ "$name" = "findings-exceptions" ]; then
              continue
            fi
            .policy-gate/scripts/apply-exceptions.sh "$EXCEPTIONS_FILE" "$dir/findings.json" \
              >"$dir/findings.json.suppressed"
            mv "$dir/findings.json.suppressed" "$dir/findings.json"
          done

      - name: Render summary and gate on deny findings
        env:
          FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(findings/*/findings.json)
          ./scripts/aggregate-findings.sh "${files[@]}"
